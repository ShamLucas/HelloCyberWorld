---
# tasks file for roles/nginx
- name: Installer Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Copier la configuration Nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: Restart nginx

- name: S’assurer que Nginx est démarré
  service:
    name: nginx
    state: started
    enabled: yes