---
# Role common : paquets et configuration de base
- name: Mettre a jour le cache APT
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Installer les paquets de base
  apt:
    name:
      - git
      - curl
      - nodejs
      - npm
    state: present

- name: Verifier si Claude Code est deja installe globalement
  command: npm list -g @anthropic-ai/claude-code --depth=0
  register: claude_code_npm_check
  failed_when: false
  changed_when: false

- name: Installer Claude Code globalement
  command: npm install -g @anthropic-ai/claude-code
  when: claude_code_npm_check.rc != 0
