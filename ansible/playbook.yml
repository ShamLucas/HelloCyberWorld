---
# Play 1 : Configuration de base (tous les hotes)
- name: Configuration de base
  hosts: all
  become: yes
  roles:
    - common

# Play 2 : Environnement dev (VM Vagrant)
- name: Dev (Vagrant)
  hosts: dev
  become: yes
  roles:
    - nginx

# Play 3 : Production (Raspberry Pi)
- name: Production (Raspberry Pi)
  hosts: raspberrypi
  become: yes
  roles:
    # - pi-hardware  # Activer quand un SSD sera installé dans le DeskPi Pro V2
    - nginx
    - markdown-site
    # Certbot est gere uniquement sur HP Envy pour eviter les conflits de challenge TLS.

# Play 4 : Production (HP Envy Debian)
- name: Production (HP Envy Debian)
  hosts: hp_envy
  become: yes
  roles:
    - hp-envy
    - docker-platform
    - nginx
    - markdown-site
    - certbot
